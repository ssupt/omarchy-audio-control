# Isolated integration graph: no ALSA, BlueZ, session manager, or real hardware.
context.properties = {
    core.daemon = true
    core.name = audio-test
    support.dbus = false
    mem.warn-mlock = false
}
context.spa-libs = {
    support.* = support/libspa-support
    audio.convert.* = audioconvert/libspa-audioconvert
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-access args = { access.force = unrestricted } }
]
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = spa-node-factory args = {
        factory.name = support.node.driver
        node.name = Audio-Test-Driver
        node.group = pipewire.dummy
        priority.driver = 20000
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = audio_test_output
        node.description = "Audio Test Output"
        media.class = Audio/Sink
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = audio_test_input
        node.description = "Audio Test Input"
        media.class = Audio/Source
        audio.position = [ MONO ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
    { factory = adapter args = {
        factory.name = support.null-audio-sink
        node.name = audio_test_playback
        application.name = "Audio Test Client"
        media.class = Stream/Output/Audio
        audio.position = [ FL FR ]
        adapter.auto-port-config = { mode = dsp monitor = true position = preserve }
    } }
]
